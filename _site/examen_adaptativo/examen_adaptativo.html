<head>

<style>
:root{
  --bg:#fbfaf7; --ink:#16181d; --mute:#4a4f59; --line:#e6e3dc; --card:#ffffff;
  --acc:#d40000; --acc-soft:#fbe9e9; --ok:#1f7a4d; --ok-soft:#e5f3ec; --bad:#b42318; --bad-soft:#fdecea;
  --warn:#9a6700;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;line-height:1.2;margin:0}
h1{font-size:2rem}
h2{font-size:1.4rem}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:600}
.lede{color:var(--mute);margin:.6rem 0 1.6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.mode{font:inherit;color:inherit;display:block;width:100%;text-align:left;cursor:pointer;margin-bottom:14px;transition:border-color .15s}
.mode:hover{border-color:var(--ink)}
.mode h3{font-size:1.15rem;margin-bottom:4px}
.mode p{margin:0;color:var(--mute);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.how{margin-top:26px;color:var(--mute);font-size:.92rem}
.how b{color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.tag{font-size:.82rem;font-weight:600;color:var(--acc)}
.lvl{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.lvl i.on{background:var(--acc)}
.lvl-txt{font-size:.78rem;color:var(--mute);margin-left:6px}
.prog{font-size:.85rem;color:var(--mute);white-space:nowrap}
.bar{height:4px;background:var(--line);border-radius:4px;margin-bottom:22px;overflow:hidden}
.bar>div{height:100%;background:var(--ink);transition:width .3s}
.q{font-size:1.06rem;margin:0 0 16px}
pre{font-family:"IBM Plex Mono",monospace;font-size:.78rem;background:#f3f1ec;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0 0 16px;line-height:1.45}
code{font-family:"IBM Plex Mono",monospace;font-size:.88em;background:#f3f1ec;padding:1px 5px;border-radius:4px}
pre code{background:none;padding:0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:600;color:var(--mute)}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel .k{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.numrow input{font:inherit;font-size:1.05rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:200px;background:var(--card)}
.numrow input:focus{outline:2px solid var(--ink);outline-offset:-1px}
.hint{font-size:.82rem;color:var(--mute)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.btn{font:inherit;font-weight:600;border:none;border-radius:10px;padding:11px 20px;cursor:pointer;background:var(--ink);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:500}
.btn.acc{background:var(--acc)}
.fb{border-radius:10px;padding:14px 16px;margin-top:6px;font-size:.95rem}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb b.v{display:block;margin-bottom:4px}
.adapt{font-size:.82rem;color:var(--mute);margin-top:10px}
.res-head{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;margin:10px 0 24px}
.big{font-family:"Source Serif 4",serif;font-size:3rem;font-weight:600;line-height:1}
.big small{font-size:1rem;color:var(--mute);font-weight:400}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:none}
.tname{font-weight:600}
.tscore{font-size:.85rem;color:var(--mute);text-align:right}
.meter{grid-column:1/-1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.meter>div{height:100%;border-radius:8px}
.badge{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:8px}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-mid{background:#fff4d6;color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-na{background:var(--line);color:var(--mute)}
.reco{margin-top:22px}
.reco li{margin-bottom:6px}
.review details{border-top:1px solid var(--line);padding:12px 0}
.review summary{cursor:pointer;font-weight:500}
.review .q{font-size:.95rem;margin-top:10px}
.muted{color:var(--mute)}
.back{display:inline-block;font-size:.88rem;color:var(--mute);text-decoration:none;margin-bottom:18px}
.back:hover{color:var(--ink)}
a{color:var(--acc)}
mjx-container[display="false"]{margin:0 1px}
@media (max-width:520px){
  html,body{font-size:16px}
  .wrap{padding:18px 14px 60px}
  h1{font-size:1.6rem}
  .card{padding:16px}
  .numrow input{width:100%}
}
</style>
</head>

<script>
const TOPICS = [{"id": "intro", "name": "Predicción y causalidad", "deck": "Introducción: predicción, estimación y causalidad"}, {"id": "mco", "name": "MCO y alta dimensionalidad", "deck": "MCO: alta dimensionalidad"}, {"id": "lasso", "name": "Lasso", "deck": "LASSO: regularización y selección"}, {"id": "causal", "name": "Inferencia causal", "deck": "Inferencia causal: resultados potenciales"}, {"id": "dlasso", "name": "Doble Lasso", "deck": "Doble Lasso: inferencia"}, {"id": "rf", "name": "Árboles y bosques", "deck": "Random Forest"}, {"id": "dml", "name": "DML", "deck": "Double/debiased machine learning"}];
const BANK = [{"id": "i1", "t": "intro", "lvl": 1, "type": "mc", "q": "Ante nubes en el cielo hay que decidir si llevar sombrilla; ante una sequía, si invertir en un baile para la lluvia. ¿Cuál es un problema de <b>predicción<\/b>?", "opts": ["La sombrilla", "El baile para la lluvia", "Ambos", "Ninguno: los dos son causales"], "ans": 0, "exp": "La sombrilla no cambia la probabilidad de lluvia: $\\partial Y/\\partial X_0=0$. El valor de la decisión depende solo de predecir bien $Y$. En el baile ocurre lo contrario: $\\partial\\pi/\\partial X_0=0$ y todo depende del efecto causal $\\partial Y/\\partial X_0$."}, {"id": "i2", "t": "intro", "lvl": 1, "type": "mc", "q": "En la descomposición $MSE(x)=\\text{Varianza}+\\text{Sesgo}^2+\\sigma^2$, el término $\\sigma^2$:", "opts": ["Es el error irreducible: no depende del modelo", "Disminuye al aumentar la complejidad del modelo", "Es cero cuando se usa MCO", "Mide cuánto varía $\\hat f$ de muestra a muestra"], "ans": 0, "exp": "$\\sigma^2$ es la varianza del ruido $\\epsilon$ en $y=f(x)+\\epsilon$. Ningún modelo puede reducirlo; solo la varianza y el sesgo dependen de $\\hat f$."}, {"id": "i3", "t": "intro", "lvl": 1, "type": "mc", "q": "¿Cuál es el objeto de interés en un problema de <b>estimación<\/b>, frente a uno de predicción?", "opts": ["$\\hat\\beta$, en lugar de $\\hat Y$", "$\\hat Y$, en lugar de $\\hat\\beta$", "El $R^2$ fuera de muestra", "El error irreducible $\\sigma^2$"], "ans": 0, "exp": "En predicción nos interesa $\\hat Y$ frente a $Y$ (dominio del ML). En estimación nos interesa $\\hat\\beta$ (dominio de la econometría)."}, {"id": "i4", "t": "intro", "lvl": 2, "type": "mc", "q": "En $Y=\\beta_X X+\\beta_W W+\\epsilon$, ni $\\hat\\beta_X$ ni $\\hat\\beta_W$ son significativos. ¿Qué se puede concluir sobre la capacidad de $X$ y $W$ para predecir $Y$?", "opts": ["Nada definitivo: pueden predecir bien $Y$ aunque cada coeficiente sea impreciso (p. ej., si $X$ y $W$ están muy correlacionadas)", "Que $X$ y $W$ no sirven para predecir $Y$", "Que el $R^2$ del modelo es cercano a cero", "Que el modelo tiene sesgo por variable omitida"], "ans": 0, "exp": "La significancia individual habla de la precisión de cada $\\hat\\beta$, no del poder predictivo conjunto. Con multicolinealidad los errores estándar se inflan, aunque $\\hat Y$ sea muy preciso."}, {"id": "i5", "t": "intro", "lvl": 2, "type": "num", "q": "Para un punto $x$: $E_D\\hat f(x)=2.3$, $f(x)=2.0$, $E_D[(\\hat f(x)-E_D\\hat f(x))^2]=0.05$ y $\\sigma^2=0.10$. Calcule $MSE(x)$.", "ans": 0.24, "tol": 0.005, "exp": "$MSE=\\text{Var}+\\text{Sesgo}^2+\\sigma^2=0.05+(2.3-2.0)^2+0.10=0.05+0.09+0.10=0.24$."}, {"id": "i6", "t": "intro", "lvl": 2, "type": "mc", "q": "El juez decide (a) si detiene al acusado antes del juicio y (b) si le pone brazalete electrónico. ¿Cuál decisión requiere conocer un <b>efecto causal<\/b>?", "opts": ["(b): el brazalete puede cambiar la probabilidad de escape, $\\partial Y/\\partial X_0\\neq0$", "(a): la detención depende del efecto de la cárcel sobre la reincidencia", "Ambas son problemas de predicción pura", "Ninguna: ambas dependen solo del riesgo predicho"], "ans": 0, "exp": "En (a) el pago depende del riesgo de escape si se libera: es predicción. En (b) el brazalete es una intervención que puede alterar $Y$; para decidir hay que saber cuánto la altera."}, {"id": "i7", "t": "intro", "lvl": 3, "type": "mc", "q": "En $\\hat f_{ML}=\\arg\\min_f \\frac1n\\sum_i (y_i-f(x_i))^2+\\lambda R(f)$, ¿qué ocurre cuando $\\lambda\\to\\infty$?", "opts": ["Se elige la función más simple posible: varianza baja y sesgo alto", "Se recupera MCO: sesgo cero y varianza alta", "El MSE fuera de muestra se minimiza siempre", "El error irreducible tiende a cero"], "ans": 0, "exp": "Con $\\lambda$ muy grande domina la penalidad: $R(f)$ se lleva a su mínimo (p. ej., todos los coeficientes en cero). El modelo casi no varía entre muestras, pero queda muy sesgado. Con $\\lambda=0$ se vuelve a MCO."}, {"id": "i8", "t": "intro", "lvl": 3, "type": "num", "q": "La función de pago es $\\pi(X_0,Y)=-0.1X_0+10Y$ y el efecto causal de la acción es $\\partial Y/\\partial X_0=0.02$. Calcule $d\\pi/dX_0$.", "ans": 0.1, "tol": 0.002, "exp": "$\\frac{d\\pi}{dX_0}=\\frac{\\partial\\pi}{\\partial X_0}+\\frac{\\partial\\pi}{\\partial Y}\\frac{\\partial Y}{\\partial X_0}=-0.1+10(0.02)=0.1$. Vale la pena aumentar $X_0$ solo porque su efecto causal compensa el costo directo."}, {"id": "i9", "t": "intro", "lvl": 3, "type": "mc", "q": "¿Por qué un algoritmo de ML puede superar a MCO <b>fuera de muestra<\/b>, aunque MCO tenga sesgo cero?", "opts": ["Porque acepta algo de sesgo a cambio de una reducción mayor en la varianza", "Porque elimina el error irreducible", "Porque minimiza el MSE dentro de muestra mejor que MCO", "Porque MCO es sesgado cuando $n$ es grande"], "ans": 0, "exp": "MCO minimiza el error dentro de muestra y puede tener varianza alta. La regularización introduce sesgo, pero si la varianza cae más, el MSE fuera de muestra baja."}, {"id": "i10", "t": "intro", "lvl": 2, "type": "mc", "q": "En $Y=\\alpha D+g(W)+\\epsilon$, ¿cuándo conviene usar ML en lugar de econometría clásica para recuperar $\\alpha$?", "opts": ["Cuando $W$ es grande y $g(W)$ es no lineal", "Cuando $W$ es pequeño y el modelo es lineal", "Cuando $D$ es asignado aleatoriamente y no hay $W$", "Nunca: el ML solo sirve para predicción"], "ans": 0, "exp": "Con pocos confusores y un modelo lineal, MCO funciona. Cuando hay muchos confusores o $g(W)$ es no lineal, el ML aproxima mejor $g(W)$, que es un problema de predicción."}, {"id": "m1", "t": "mco", "lvl": 1, "type": "mc", "q": "El estimador MCO es el análogo muestral de:", "opts": ["El mejor predictor lineal (BLP), que minimiza $E[(Y-\\beta'X)^2]$", "La esperanza condicional $E[Y\\mid W]$ para cualquier forma funcional", "El estimador que minimiza el MSE fuera de muestra", "El estimador Lasso con $\\lambda\\gt 0$"], "ans": 0, "exp": "El BLP resuelve $\\min_\\beta E[(Y-\\beta'X)^2]$; MCO reemplaza la esperanza por el promedio muestral."}, {"id": "m2", "t": "mco", "lvl": 1, "type": "mc", "q": "¿Qué describe el <b>overfitting<\/b>?", "opts": ["Muy buen ajuste dentro de muestra y pésimo fuera de muestra", "Mal ajuste tanto dentro como fuera de muestra", "Un modelo con sesgo alto y varianza baja", "Que el $R^2$ ajustado sea mayor que el $R^2$"], "ans": 0, "exp": "Cuando $p/n$ no es pequeño, el modelo sigue el ruido de la muestra de entrenamiento. Las medidas de ajuste dentro de muestra se vuelven engañosas."}, {"id": "m3", "t": "mco", "lvl": 2, "type": "mc", "q": "Notebook de predicción de salarios (GEIH Barranquilla). ¿Por qué el $R^2_{test}$ del modelo flexible es <b>negativo<\/b>?", "opts": ["Su MSE fuera de muestra supera la varianza de $y$ alrededor de la media de entrenamiento: predice peor que la media. Es overfitting", "Porque el modelo tiene menos regresores que el básico", "Por un error de cálculo: el $R^2$ no puede ser negativo", "Porque el modelo flexible tiene sesgo por variable omitida"], "ans": 0, "exp": "$R^2_{test}=1-MSE_{test}/\\overline{(y-\\bar y_{train})^2}$. Con $MSE_{test}=1.871$ el cociente supera 1. Con 405 regresores el modelo sobreajustó: dentro de muestra $R^2=0.57$, pero fuera de muestra se desploma.", "code": "              p  R2_sample  MSE_sample  R2_test  MSE_test\nbasic reg    94      0.51        0.18     0.443     0.192\nflexible reg 405     0.57        0.16    -4.427     1.871"}, {"id": "m4", "t": "mco", "lvl": 2, "type": "num", "q": "Con $n=500$ observaciones de entrenamiento, $p=100$ regresores y $MSE_{sample}=0.16$, calcule el MSE ajustado $\\frac{n}{n-p}MSE_{sample}$.", "ans": 0.2, "tol": 0.002, "exp": "$\\frac{500}{400}\\times0.16=0.20$. El ajuste penaliza el número de parámetros porque el MSE dentro de muestra subestima el error de predicción."}, {"id": "m5", "t": "mco", "lvl": 2, "type": "num", "q": "En la muestra de prueba, $MSE_{test}=0.1921$ y $\\frac1{n_{test}}\\sum(y_i-\\bar y_{train})^2=0.345$. Calcule el $R^2_{test}$ (3 decimales).", "ans": 0.443, "tol": 0.003, "exp": "$R^2_{test}=1-0.1921/0.345=0.443$. Es el valor del modelo básico en el notebook de salarios."}, {"id": "m6", "t": "mco", "lvl": 3, "type": "mc", "q": "Si $p\\gt n$ en una regresión por MCO:", "opts": ["$X'X$ es singular, $\\beta$ no está identificado y se puede lograr un ajuste perfecto dentro de muestra", "MCO sigue siendo consistente si los errores son homocedásticos", "El $R^2$ dentro de muestra es cercano a cero", "Basta usar errores estándar robustos"], "ans": 0, "exp": "Con más parámetros que observaciones, $\\sum_i X_iX_i'$ no es invertible y hay infinitas soluciones. El ajuste dentro de muestra puede ser perfecto y no dice nada sobre el desempeño fuera de muestra."}, {"id": "m7", "t": "mco", "lvl": 3, "type": "mc", "q": "La varianza asintótica de MCO es $E[XX']^{-1}E[\\epsilon^2XX']E[XX']^{-1}$. ¿A qué se reduce bajo <b>homocedasticidad<\/b>, $E[\\epsilon^2\\mid X]=\\sigma^2$?", "opts": ["$\\sigma^2E[XX']^{-1}$", "$\\sigma^2E[XX']$", "$E[\\epsilon^2XX']^{-1}$", "$\\sigma^2/n$"], "ans": 0, "exp": "Por expectativas iteradas, $E[\\epsilon^2XX']=E[E[\\epsilon^2\\mid X]XX']=\\sigma^2E[XX']$. Al reemplazar en la forma sándwich queda $\\sigma^2E[XX']^{-1}$. Sin homocedasticidad se usa la versión robusta (HC1 en los notebooks)."}, {"id": "m8", "t": "mco", "lvl": 1, "type": "mc", "q": "¿Para qué usamos regresores transformados $X=T(W)$, como $W_1^2$ o interacciones?", "opts": ["Para aproximar mejor $g(W)=E[Y\\mid W]$ cuando la relación no es lineal", "Para reducir el número de parámetros", "Para eliminar la heterocedasticidad", "Para garantizar que $E[\\epsilon\\mid X]=0$"], "ans": 0, "exp": "El mejor predictor es la CEF $g(W)$. Con $\\beta'T(W)$ la aproximamos de forma lineal en parámetros pero flexible en $W$, como en el ejemplo con $g(W)=\\exp(4W)$ y polinomios."}, {"id": "m9", "t": "mco", "lvl": 3, "type": "mc", "q": "Con $n$ fijo, se agregan regresores (polinomios de mayor grado) a una regresión por MCO. ¿Qué afirmación es correcta?", "opts": ["El $R^2$ dentro de muestra nunca disminuye, pero el MSE fuera de muestra puede aumentar", "Tanto el $R^2$ dentro como el de fuera de muestra aumentan siempre", "El $R^2$ dentro de muestra disminuye cuando $p/n$ es grande", "El MSE fuera de muestra es igual al de dentro de muestra si $p\\lt n$"], "ans": 0, "exp": "MCO minimiza la suma de residuales al cuadrado; añadir regresores nunca empeora el ajuste dentro de muestra. Pero la varianza crece y, cuando $p/n$ no es pequeño, $MSE_{sample}$ deja de aproximar $MSE_{pop}$."}, {"id": "l1", "t": "lasso", "lvl": 1, "type": "mc", "q": "¿Qué distingue la penalidad de Lasso, $\\lambda\\sum_j|\\beta_j|$?", "opts": ["Encoge los coeficientes y lleva algunos <b>exactamente a cero<\/b>: selecciona variables", "Encoge los coeficientes pero ninguno llega a cero", "No introduce sesgo en los coeficientes", "Garantiza seleccionar las variables con $\\beta_j\\neq0$ en la población"], "ans": 0, "exp": "La penalidad en valor absoluto produce soluciones en las esquinas: algunos $\\hat\\beta_j=0$. Hay sesgo de encogimiento (shrinkage), y las variables seleccionadas no necesariamente son las correctas."}, {"id": "l2", "t": "lasso", "lvl": 1, "type": "mc", "q": "¿Qué estimador se obtiene con Lasso si $\\lambda=0$?", "opts": ["MCO", "Un modelo con solo intercepto", "Post-Lasso", "Ridge"], "ans": 0, "exp": "Sin penalidad, el problema es minimizar la suma de residuales al cuadrado, que es MCO."}, {"id": "l3", "t": "lasso", "lvl": 2, "type": "num", "q": "$\\hat\\theta$ es insesgado con $Var(\\hat\\theta)=v=1$, y $\\theta=1$. Para $\\tilde\\theta=a\\hat\\theta$ con $a=0.5$, calcule $MSE(\\tilde\\theta)$.", "ans": 0.5, "tol": 0.005, "exp": "$MSE(\\tilde\\theta)=a^2v+(a-1)^2\\theta^2=0.25(1)+0.25(1)=0.5$, menor que $MSE(\\hat\\theta)=v=1$. Un estimador sesgado puede tener menor MSE."}, {"id": "l4", "t": "lasso", "lvl": 2, "type": "num", "q": "Con $\\tilde\\theta=a\\hat\\theta$, $a=0.5$ y $v=2$, $MSE(\\tilde\\theta)\\lt MSE(\\hat\\theta)$ si y solo si $\\theta^2\\lt c$. Calcule $c$.", "ans": 6.0, "tol": 0.02, "exp": "La condición es $\\theta^2\\lt \\frac{1+a}{1-a}v=\\frac{1.5}{0.5}(2)=6$. El encogimiento conviene cuando el parámetro verdadero es pequeño en relación con la varianza."}, {"id": "l5", "t": "lasso", "lvl": 2, "type": "mc", "q": "Salida de <code>cv.glmnet<\/code> en el notebook de salarios. ¿Qué representa la fila <code>1se<\/code> y por qué tiene menos variables?", "opts": ["Es el $\\lambda$ más grande cuyo MSE de validación cruzada está a menos de un error estándar del mínimo: más penalidad, modelo más parsimonioso", "Es el $\\lambda$ que minimiza el MSE de validación cruzada", "Es el $\\lambda$ teórico (plug-in)", "Es el modelo estimado sin validación cruzada"], "ans": 0, "exp": "<code>lambda.min<\/code>=0.0061 minimiza el CV-MSE (96 variables). <code>lambda.1se<\/code>=0.0297 es mayor: su MSE (0.2088) no es estadísticamente distinto del mínimo, y conserva solo 22 variables.", "code": "      Lambda Index Measure      SE Nonzero\nmin 0.006116    40  0.1989 0.01071      96\n1se 0.029739    23  0.2088 0.01237      22"}, {"id": "l6", "t": "lasso", "lvl": 2, "type": "mc", "q": "Resultados fuera de muestra del notebook de salarios. ¿Qué se concluye?", "opts": ["Lasso controla el sobreajuste del modelo flexible: su desempeño fuera de muestra es similar al de dentro de muestra", "El modelo flexible por MCO es el mejor predictor", "Lasso empeora la predicción frente al modelo básico", "Las tres especificaciones son equivalentes"], "ans": 0, "exp": "Con las mismas 405+ variables del modelo flexible, Lasso logra $MSE_{test}=0.187$, frente a 1.871 de MCO, y algo mejor que el modelo básico.", "code": "                 MSE_test  R2_test\nbasic reg           0.192    0.443\nflexible reg        1.871   -4.427\nlasso regression    0.187    0.457"}, {"id": "l7", "t": "lasso", "lvl": 3, "type": "num", "q": "Calcule el $\\lambda$ teórico $\\lambda=2c\\hat\\sigma\\sqrt n\\,z_{1-a/(2p)}$ con $c=1.1$, $a=0.05$, $\\hat\\sigma=0.4$, $n=400$ y $p=50$. Use $z_{0.9995}=3.2905$.", "ans": 57.91, "tol": 0.3, "exp": "$\\lambda=2(1.1)(0.4)(20)(3.2905)=17.6\\times3.2905\\approx57.91$. Es la regla que usa <code>rlasso<\/code> del paquete <code>hdm<\/code>."}, {"id": "l8", "t": "lasso", "lvl": 3, "type": "mc", "q": "¿Cuál es el propósito de MCO Post-Lasso?", "opts": ["Reestimar por MCO con los regresores que Lasso seleccionó, para deshacer el sesgo de encogimiento", "Elegir $\\lambda$ por validación cruzada", "Seleccionar variables que Lasso descartó", "Corregir la heterocedasticidad de los errores"], "ans": 0, "exp": "Post-Lasso usa la selección de Lasso ($b_j=0$ si $\\hat\\beta_j=0$) y estima sin penalidad los coeficientes restantes, lo que elimina el encogimiento hacia cero."}, {"id": "l9", "t": "lasso", "lvl": 3, "type": "mc", "q": "$X_j$ y $X_k$ están muy correlacionadas y ambas tienen $\\beta\\neq0$ en la población. Lasso selecciona $X_j$ y lleva $\\hat\\beta_k$ a cero. ¿Qué implica?", "opts": ["Es esperable: Lasso busca buena predicción y puede elegir una de las dos; la selección no identifica el modelo verdadero", "Que $\\beta_k=0$ en la población", "Que $\\lambda$ está mal elegido", "Que $X_k$ no está correlacionada con $Y$"], "ans": 0, "exp": "$\\hat\\beta_k=0$ cuando el beneficio marginal en predicción de $X_k$ es menor que $\\lambda$. Si $X_j$ ya captura esa información, $X_k$ aporta poco. Por eso no se debe interpretar la selección de Lasso como causal ni como el modelo verdadero."}, {"id": "l10", "t": "lasso", "lvl": 1, "type": "num", "q": "Validación cruzada con $K=5$: los MSE en cada fold son 0.20, 0.18, 0.22, 0.19 y 0.21. Calcule $CV_K$.", "ans": 0.2, "tol": 0.002, "exp": "$CV_K=\\frac1K\\sum_j MSE_j=(0.20+0.18+0.22+0.19+0.21)/5=0.20$."}, {"id": "c1", "t": "causal", "lvl": 1, "type": "mc", "q": "¿Por qué no podemos calcular directamente $\\Delta_i=Y_i(1)-Y_i(0)$?", "opts": ["Porque para cada individuo solo observamos uno de los dos resultados potenciales", "Porque $Y_i(1)$ y $Y_i(0)$ son siempre iguales", "Porque el tratamiento nunca es aleatorio", "Porque $D_i$ no es observable"], "ans": 0, "exp": "Observamos $Y_i=Y_i(D_i)$: el resultado bajo el tratamiento recibido. El contrafactual no se observa, por eso nos enfocamos en parámetros poblacionales como el ATE."}, {"id": "c2", "t": "causal", "lvl": 1, "type": "num", "q": "El 40% de la población recibe tratamiento ($\\pi=0.4$), $ATT=2$ y $ATU=1$. Calcule el ATE.", "ans": 1.4, "tol": 0.005, "exp": "$ATE=\\pi\\,ATT+(1-\\pi)ATU=0.4(2)+0.6(1)=1.4$."}, {"id": "c3", "t": "causal", "lvl": 2, "type": "num", "q": "Con $ATE=1.4$, $\\pi=0.4$, $ATT=2$, $ATU=1$ y sesgo de selección $E[Y(0)\\mid D=1]-E[Y(0)\\mid D=0]=0.5$, ¿cuánto vale la diferencia simple de medias (SDO)?", "ans": 2.5, "tol": 0.005, "exp": "$SDO=ATE+\\text{sesgo de selección}+(1-\\pi)(ATT-ATU)=1.4+0.5+0.6(1)=2.5$. La SDO sobrestima el ATE en 1.1."}, {"id": "c4", "t": "causal", "lvl": 2, "type": "mc", "q": "Bajo asignación aleatoria, $(Y(1),Y(0))\\perp D$. ¿Por qué entonces $SDO=ATE$?", "opts": ["El sesgo de selección es cero y $ATT=ATU$, así que ambos términos de sesgo desaparecen", "Porque $Y(1)=Y(0)$ para todos", "Porque el tratamiento no tiene efecto", "Porque se controla por todas las covariables"], "ans": 0, "exp": "Con independencia, $E[Y(0)\\mid D=1]=E[Y(0)\\mid D=0]=E[Y(0)]$ y el efecto promedio es el mismo en tratados y no tratados."}, {"id": "c5", "t": "causal", "lvl": 2, "type": "mc", "q": "Notebook de informalidad: se estima <code>lm(lw ~ inf)<\/code>. ¿Se puede interpretar el coeficiente como el efecto causal de la informalidad sobre el salario?", "opts": ["No: los informales difieren en características que afectan el salario (educación, experiencia). Hay sesgo de selección, probablemente $E[Y(0)\\mid D=1]\\lt E[Y(0)\\mid D=0]$", "Sí, porque se usaron errores estándar robustos", "Sí, porque la muestra es grande", "No, porque el coeficiente es negativo"], "ans": 0, "exp": "La SDO mezcla el ATE con el sesgo de selección. Los trabajadores informales probablemente tendrían menores salarios aun siendo formales, así que la SDO exagera la penalidad por informalidad. Los errores estándar no tienen nada que ver con la identificación.", "code": "# salida ilustrativa\nCoeficiente y error estándar robusto de Inf -0.6124 0.0187"}, {"id": "c6", "t": "causal", "lvl": 3, "type": "num", "q": "En un RCT se estima $E[Y\\mid D,X]=(\\alpha_1+\\alpha_2X)D+\\beta X$ <b>sin centrar<\/b> $X$. Si $\\hat\\alpha_1=0.3$, $\\hat\\alpha_2=0.05$ y $\\bar X=10$, ¿cuál es el ATE estimado?", "ans": 0.8, "tol": 0.005, "exp": "$ATE=E[\\delta(X)]=\\alpha_1+\\alpha_2E[X]=0.3+0.05(10)=0.8$. Solo si $X$ está centrada ($E[X]=0$) el ATE es $\\alpha_1$."}, {"id": "c7", "t": "causal", "lvl": 3, "type": "mc", "q": "¿Qué verifica el <b>covariate balance check<\/b> en un RCT?", "opts": ["Que $E[X\\mid D=1]=E[X\\mid D=0]$, como implica la asignación aleatoria", "Que el efecto del tratamiento es homogéneo", "Que las covariables predicen bien $Y$", "Que no hay heterocedasticidad"], "ans": 0, "exp": "Si $(Y(1),Y(0),X)\\perp D$, las covariables pretratamiento deben tener la misma media en ambos grupos. Diferencias sistemáticas sugieren problemas en la aleatorización o desbalance por azar."}, {"id": "c8", "t": "causal", "lvl": 1, "type": "mc", "q": "El ATT se define como:", "opts": ["$E[Y_i(1)-Y_i(0)\\mid D_i=1]$", "$E[Y_i(1)-Y_i(0)]$", "$E[Y_i(1)-Y_i(0)\\mid D_i=0]$", "$E[Y\\mid D=1]-E[Y\\mid D=0]$"], "ans": 0, "exp": "El ATT es el efecto promedio en los tratados. La segunda opción es el ATE, la tercera el ATU y la cuarta la SDO."}, {"id": "c9", "t": "causal", "lvl": 3, "type": "mc", "q": "En un RCT se agregan covariables <b>pretratamiento<\/b> a la regresión de $Y$ sobre $D$. ¿Qué ocurre con la estimación del ATE?", "opts": ["Sigue siendo consistente y, si las covariables predicen $Y$, suele ser más precisa", "Se vuelve sesgada porque las covariables son endógenas", "Es necesario para identificar el ATE", "Cambia el parámetro estimado de ATE a ATT"], "ans": 0, "exp": "La aleatorización ya identifica el ATE. Las covariables pretratamiento reducen la varianza residual y mejoran la precisión; con interacciones permiten explorar heterogeneidad (CATE). Las covariables postratamiento sí podrían sesgar."}, {"id": "d1", "t": "dlasso", "lvl": 1, "type": "mc", "q": "Una buena variable de control en $Y=\\alpha D+\\beta'W+\\epsilon$ cumple dos condiciones:", "opts": ["Predice $Y$ (relevancia) y está correlacionada con $D$ (confunde)", "No está correlacionada ni con $Y$ ni con $D$", "Está correlacionada con $D$ pero no con $Y$", "Es una variable postratamiento"], "ans": 0, "exp": "Omitir una variable que cumple ambas condiciones produce sesgo por variable omitida e invalida la inferencia causal sobre $\\alpha$."}, {"id": "d2", "t": "dlasso", "lvl": 1, "type": "mc", "q": "En el notebook de brecha salarial, la regresión directa y el partialling-out dan el mismo coeficiente. ¿Qué resultado lo garantiza?", "opts": ["El teorema de Frisch-Waugh-Lovell", "La ortogonalidad de Neyman", "El teorema del límite central", "La asignación aleatoria de $M$"], "ans": 0, "exp": "FWL: el coeficiente de $D$ en la regresión larga es igual al de regresar el residual de $Y$ (sobre $W$) en el residual de $D$ (sobre $W$).", "code": "MCO directo:     Coef. M: -0.0883  | EE: 0.0161\nPartialling-out: Coef. M: -0.0883  | EE: 0.0159"}, {"id": "d3", "t": "dlasso", "lvl": 2, "type": "mc", "q": "¿Cuál es el problema de la selección simple (Lasso de $Y$ sobre $D$ y $W$, y luego MCO con las $W$ seleccionadas)?", "opts": ["Descarta controles con efecto pequeño sobre $Y$ pero muy correlacionados con $D$, que generan sesgo por variable omitida", "Selecciona demasiadas variables", "Es computacionalmente costosa", "Requiere que $p\\lt n$"], "ans": 0, "exp": "Lasso en la ecuación de $Y$ solo mira el poder predictivo para $Y$. Un confusor débil en $Y$ pero fuerte en $D$ queda fuera. Doble Lasso agrega la ecuación de $D$ para capturarlo."}, {"id": "d4", "t": "dlasso", "lvl": 2, "type": "num", "q": "Doble Lasso con la especificación flexible da $\\hat\\alpha=-0.0918$ con EE $=0.0156$. Calcule el estadístico $t$ (2 decimales).", "ans": -5.88, "tol": 0.02, "exp": "$t=-0.0918/0.0156=-5.88$. Se rechaza $H_0:\\alpha=0$. Las mujeres ganan cerca de 9% menos por hora, condicional en los controles.", "code": "Coef. M: -0.0918  | EE: 0.0156"}, {"id": "d5", "t": "dlasso", "lvl": 2, "type": "mc", "q": "En el notebook, MCO con 471 regresores da $-0.088$ y doble Lasso $-0.0918$. ¿Por qué los resultados son tan parecidos?", "opts": ["Porque $p/n$ es pequeño: con muchas observaciones, MCO todavía funciona bien", "Porque Lasso no seleccionó ninguna variable", "Porque doble Lasso siempre coincide con MCO", "Porque la brecha salarial es cero"], "ans": 0, "exp": "Doble Lasso es valioso cuando $p$ es grande respecto a $n$. Si $p/n$ es pequeño, MCO es preciso y ambos estimadores coinciden aproximadamente.", "code": "MCO flexible:        Coef. M: -0.088   | EE: 0.0169\nDoble Lasso flexible: Coef. M: -0.0918  | EE: 0.0156"}, {"id": "d6", "t": "dlasso", "lvl": 3, "type": "mc", "q": "La ecuación de momentos $M(a,\\eta)=E[(\\tilde Y(\\eta)-a\\tilde D(\\eta))\\tilde D(\\eta)]$ es Neyman ortogonal: $\\partial_\\eta M(\\alpha,\\eta_o)=0$. ¿Qué implica?", "opts": ["El sesgo de regularización en $\\hat\\eta$ no se transmite a $\\hat\\alpha$, al menos a primer orden", "$\\hat\\eta$ se estima sin sesgo", "$\\alpha$ no depende de $W$", "No es necesario estimar $\\eta$"], "ans": 0, "exp": "$\\alpha$ es localmente insensible a errores en los parámetros de molestia. En cambio, la selección simple usa $E[(Y-aD-b'W)D]$, con derivada $E[DW]\\neq0$: no es ortogonal."}, {"id": "d7", "t": "dlasso", "lvl": 3, "type": "mc", "q": "En el notebook de doble Lasso, sin sample splitting, se usa <code>rlasso<\/code> (λ teórico) en lugar de validación cruzada. ¿Por qué?", "opts": ["La regla plug-in evita el sobreajuste en la primera etapa; con CV en muestras moderadas el error en $\\check Y$ y $\\check D$ puede afectar $\\hat\\alpha$ a primer orden", "Porque CV no puede usarse con variables binarias", "Porque el λ teórico siempre da menor MSE de predicción", "Porque rlasso no encoge los coeficientes"], "ans": 0, "exp": "La teoría de doble Lasso requiere buena predicción de $D$ y $Y$ sin sobreajuste, que la regla plug-in garantiza. Con CV la solución es hacer cross-fitting, que es DML."}, {"id": "d8", "t": "dlasso", "lvl": 3, "type": "mc", "q": "Se incluye $W$ solo si su estadístico $t$ es grande y luego se reporta $\\tilde\\alpha$ como si el modelo fuera el verdadero. Si $\\beta$ es pequeño pero distinto de cero y $D$ y $W$ están muy correlacionadas:", "opts": ["La distribución de $\\tilde\\alpha$ no es normal (puede ser bimodal) y las pruebas e intervalos quedan distorsionados", "$\\tilde\\alpha$ es consistente y normal", "Solo aumenta la varianza, sin sesgo", "El problema desaparece con errores robustos"], "ans": 0, "exp": "La selección no es uniformemente consistente: con alta probabilidad omite $W$ y genera sesgo, y otras veces la incluye. La mezcla produce una distribución no normal. Es el problema de la inferencia post-selección."}, {"id": "d9", "t": "dlasso", "lvl": 2, "type": "num", "q": "Con los residuales de la primera etapa, $\\sum_i\\check D_i\\check Y_i=-3.6$ y $\\sum_i\\check D_i^2=40$. Calcule $\\hat\\alpha$.", "ans": -0.09, "tol": 0.001, "exp": "$\\hat\\alpha=(\\mathbb E_n[\\check D^2])^{-1}\\mathbb E_n[\\check D\\check Y]=-3.6/40=-0.09$. Los $1/n$ se cancelan."}, {"id": "d10", "t": "dlasso", "lvl": 1, "type": "mc", "q": "¿Qué pasa si se agrega a la regresión una variable que <b>no predice<\/b> $Y$ (no cumple relevancia)?", "opts": ["Deteriora la precisión de la estimación de $\\alpha$", "Mejora la precisión de la estimación de $\\alpha$", "Genera sesgo por variable omitida", "No tiene ningún efecto"], "ans": 0, "exp": "Una variable irrelevante no reduce la varianza residual y, si está correlacionada con $D$, aumenta la varianza de $\\hat\\alpha$. Una variable relevante, en cambio, mejora la precisión."}, {"id": "r1", "t": "rf", "lvl": 1, "type": "mc", "q": "¿Cómo predice un árbol de regresión en un punto $x$?", "opts": ["Con el promedio de las $Y_i$ que caen en la misma hoja $L(x)$", "Con una regresión lineal dentro de cada hoja", "Con la mediana de todas las $Y_i$", "Con el valor de $Y$ de la observación más cercana"], "ans": 0, "exp": "$\\hat\\mu(x)=\\sum_i\\alpha_i(x)Y_i$ con $\\alpha_i(x)=1\\{X_i\\in L(x)\\}/|\\{i:X_i\\in L(x)\\}|$: una función constante por tramos."}, {"id": "r2", "t": "rf", "lvl": 1, "type": "mc", "q": "El bagging (promediar árboles construidos en submuestras) sirve principalmente para:", "opts": ["Reducir la varianza", "Reducir el sesgo", "Seleccionar variables", "Reducir el error irreducible"], "ans": 0, "exp": "Un árbol profundo es muy inestable. Promediar $B$ árboles sobre submuestras suaviza la predicción y reduce la varianza."}, {"id": "r3", "t": "rf", "lvl": 2, "type": "num", "q": "Un nodo de clasificación tiene una proporción de unos $\\bar Y_A=0.3$. Calcule el índice de Gini $G(A)$.", "ans": 0.42, "tol": 0.003, "exp": "$G(A)=1-\\bar Y_A^2-(1-\\bar Y_A)^2=1-0.09-0.49=0.42$."}, {"id": "r4", "t": "rf", "lvl": 3, "type": "num", "q": "Un nodo con $N_A=100$ y $\\bar Y_A=0.5$ se divide en $A_1$ ($N=40$, $\\bar Y=0.9$) y $A_2$ ($N=60$, $\\bar Y=14/60$). Calcule la ganancia $I(A_1,A_2)=G(A)-qG(A_1)-(1-q)G(A_2)$ (3 decimales).", "ans": 0.213, "tol": 0.003, "exp": "$G(A)=0.5$, $G(A_1)=1-0.81-0.01=0.18$, $G(A_2)\\approx0.358$, $q=0.4$. $I=0.5-0.4(0.18)-0.6(0.358)\\approx0.213$."}, {"id": "r5", "t": "rf", "lvl": 2, "type": "mc", "q": "Salida de <code>printcp<\/code> en el notebook. ¿Por qué se poda con el CP de la fila 8 y no con el último, que tiene menor <code>rel error<\/code>?", "opts": ["Porque <code>rel error<\/code> es dentro de muestra y siempre baja; <code>xerror<\/code> es validado cruzado y es mínimo en la fila 8", "Porque la fila 8 tiene el mayor número de cortes", "Porque <code>xstd<\/code> es máximo en la fila 8", "Porque el CP debe ser siempre mayor que 0.004"], "ans": 0, "exp": "Más cortes siempre reducen el error dentro de muestra. El error de validación cruzada (<code>xerror<\/code>=0.56964) es mínimo con 7 cortes: <code>bestcp<\/code>=0.004767.", "code": "          CP nsplit rel error  xerror     xstd\n6  0.0081126      5   0.54656 0.57606 0.024852\n7  0.0080498      6   0.53844 0.57351 0.024485\n8  0.0047671      7   0.53039 0.56964 0.024347\n9  0.0039436      8   0.52563 0.56969 0.024068\n10 0.0038290     10   0.51774 0.56975 0.024091\n11 0.0034930     11   0.51391 0.57014 0.024104"}, {"id": "r6", "t": "rf", "lvl": 2, "type": "num", "q": "En la misma salida, <code>rel error<\/code> es el error relativo al nodo raíz. ¿Cuál es el $R^2$ dentro de muestra del árbol con 7 cortes (<code>rel error<\/code> = 0.53039)? Use 2 decimales.", "ans": 0.47, "tol": 0.01, "exp": "$R^2=1-\\text{rel error}=1-0.53039\\approx0.47$. Fuera de muestra el árbol podado logra $R^2=0.42$.", "code": "Root node error: 1176.4/3122 = 0.37682\n          CP nsplit rel error  xerror     xstd\n8  0.0047671      7   0.53039 0.56964 0.024347"}, {"id": "r7", "t": "rf", "lvl": 3, "type": "mc", "q": "En el notebook, <code>randomForest(..., mtry = p)<\/code> da $R^2=0.43$ y el bosque con <code>mtry<\/code> por defecto da $0.42$. ¿Qué explica la poca diferencia?", "opts": ["Con <code>mtry = p<\/code> es bagging; con solo 4 predictores, sortear variables en cada nodo casi no descorrelaciona los árboles", "Los dos modelos son idénticos", "El bosque aleatorio no reduce varianza", "<code>mtry<\/code> controla el número de árboles"], "ans": 0, "exp": "El bosque aleatorio mejora al bagging al decorrelacionar los árboles (cada corte considera un subconjunto de variables). Con pocas variables esa ganancia es pequeña."}, {"id": "r8", "t": "rf", "lvl": 3, "type": "mc", "q": "En regresión, m rtición particular."}, {"id": "k7", "t": "dml", "lvl": 3, "type": "num", "q": "Tras cross-fitting: $\\mathbb E_n[\\check D\\check Y]=0.12$, $\\mathbb E_n[\\check D^2]=0.4$, $\\mathbb E_n[\\check D^2\\hat\\epsilon^2]=0.05$ y $n=500$. Con $\\hat V=(\\mathbb E_n[\\check D^2])^{-1}\\mathbb E_n[\\check D^2\\hat\\epsilon^2](\\mathbb E_n[\\check D^2])^{-1}$, calcule el error estándar $\\sqrt{\\hat V/n}$ (3 decimales).", "ans": 0.025, "tol": 0.001, "exp": "$\\hat\\beta=0.12/0.4=0.3$. $\\hat V=0.05/0.16=0.3125$ y $se=\\sqrt{0.3125/500}=0.025$."}, {"id": "k8", "t": "dml", "lvl": 3, "type": "mc", "q": "Frente a un simple sample splitting (estimar nuisance en una mitad y $\\beta$ en la otra), cross-fitting:", "opts": ["Rota los papeles de los folds y usa las $n$ observaciones en la estimación final de $\\beta$: es más eficiente", "Elimina la necesidad de ortogonalidad de Neyman", "Produce exactamente el mismo estimador", "Requiere menos estimaciones de ML"], "ans": 0, "exp": "Con sample splitting se pierde la mitad de la muestra en la etapa final. Cross-fitting obtiene residuales fuera de muestra para todas las observaciones."}, {"id": "k9", "t": "dml", "lvl": 2, "type": "mc", "q": "Un estudiante hace partialling-out con un bosque aleatorio muy profundo, usando predicciones <b>dentro de muestra<\/b> para $\\hat\\ell(X)$ y $\\hat m(X)$. ¿Qué problema tiene?", "opts": ["Los residuales absorben poco del ruido porque el bosque lo aprendió: hay sesgo por sobreajuste en $\\hat\\beta$", "Ninguno: el teorema de partialling-out lo garantiza", "Solo aumenta el error estándar", "El bosque no puede estimar $m(X)$ si $D$ es binaria"], "ans": 0, "exp": "El partialling-out funciona con $\\ell$ y $m$ verdaderos. Con predicciones sobreajustadas, los residuales $\\check D$ son demasiado pequeños y correlacionados con el ruido. Cross-fitting lo corrige."}, {"id": "k10", "t": "dml", "lvl": 2, "type": "mc", "q": "En el modelo parcial lineal $Y=\\beta D+g(X)+\\epsilon$, el partialling-out usa $\\ell(X)=$", "opts": ["$E[Y\\mid X]$", "$E[Y\\mid D,X]$", "$g(X)$", "$E[D\\mid X]$"], "ans": 0, "exp": "$\\ell(X)=E[Y\\mid X]=\\beta m(X)+g(X)$, no $g(X)$. Así $Y-\\ell(X)=\\beta(D-m(X))+\\epsilon$."}];

// ---------- motor adaptativo (modelo tipo Rasch con actualización Elo por tema) ----------
const B = {1:-1, 2:0, 3:1};          // dificultad de cada nivel
const K = 1.2;                       // tasa de actualización
const LVLNAME = {1:"Básico",2:"Intermedio",3:"Avanzado"};
const P1_PER_TOPIC = 2;              // simulacro: preguntas por tema en la fase 1
const P2_EXTRA = 8;                  // simulacro: preguntas dirigidas a los temas débiles
const MAX_PER_TOPIC = 5;

let S = null;
const $ = s => document.querySelector(s);
const app = $("#app");
const prob = (th,b) => 1/(1+Math.exp(-(th-b)));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const tname = id => TOPICS.find(t=>t.id===id).name;

function typeset(){ if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise([app]).catch(()=>{}); } else { setTimeout(typeset,300); } }

function newState(mode, topic){
  const th={}, n={}, c={};
  TOPICS.forEach(t=>{th[t.id]=0; n[t.id]=0; c[t.id]=0;});
  return {mode, topic, th, n, c, used:new Set(), log:[], cur:null, last:null,
          total: mode==="sim" ? TOPICS.length*P1_PER_TOPIC+P2_EXTRA : BANK.filter(q=>q.t===topic).length};
}

function targetLevel(th){ // nivel cuya dificultad está más cerca de la habilidad estimada
  let best=2, d=1e9; [1,2,3].forEach(l=>{const dd=Math.abs(th-B[l]); if(dd<d-1e-9 || (Math.abs(dd-d)<1e-9 && l>best)){d=dd;best=l;}}); return best;
}
function pickItem(topic){
  const lv = targetLevel(S.th[topic]);
  const pool = BANK.filter(q=>q.t===topic && !S.used.has(q.id));
  if(!pool.length) return null;
  const minD = Math.min(...pool.map(q=>Math.abs(q.lvl-lv)));
  const cands = pool.filter(q=>Math.abs(q.lvl-lv)===minD);
  return cands[Math.floor(Math.random()*cands.length)];
}
function hasItems(t){ return BANK.some(q=>q.t===t && !S.used.has(q.id)); }
function pickTopic(){
  if(S.mode==="topic") return hasItems(S.topic) ? S.topic : null;
  const asked = S.log.length;
  const avail = TOPICS.map(t=>t.id).filter(hasItems);
  if(!avail.length) return null;
  if(asked < TOPICS.length*P1_PER_TOPIC){ // fase 1: ronda por todos los temas, en orden del curso
    const m = Math.min(...avail.map(t=>S.n[t]));
    return avail.find(t=>S.n[t]===m);
  }
  // fase 2: prioriza habilidad baja e incertidumbre alta; evita repetir tema seguido
  const lastT = S.log.length ? S.log[S.log.length-1].t : null;
  let cand = avail.filter(t=>S.n[t]<MAX_PER_TOPIC);
  if(!cand.length) cand = avail;
  if(cand.length>1) cand = cand.filter(t=>t!==lastT);
  cand.sort((a,b)=> (-S.th[b] + 0.6/(1+S.n[b])) - (-S.th[a] + 0.6/(1+S.n[a])));
  return cand[0];
}

function nextQuestion(){
  if(S.log.length >= S.total) return showResults();
  const t = pickTopic(); if(!t) return showResults();
  const q = pickItem(t); if(!q) return showResults();
  S.used.add(q.id);
  const order = q.type==="mc" ? shuffle(q.opts.map((_,i)=>i)) : null;
  S.cur = {q, order, sel:null, done:false};
  renderQuestion();
}

function lvlDots(l){ return `<span class="lvl">${[1,2,3].map(i=>`<i class="${i<=l?'on':''}"></i>`).join("")}</span><span class="lvl-txt">${LVLNAME[l]}</span>`; }

function renderQuestion(){
  const {q, order} = S.cur;
  const i = S.log.length+1;
  const pct = 100*(S.log.length)/S.total;
  let body = `<p class="q">${q.q}</p>`;
  if(q.code) body += `<pre><code>${esc(q.code)}</code></pre>`;
  if(q.type==="mc"){
    body += order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${q.opts[oi]}</span></button>`).join("");
  } else {
    body += `<div class="numrow"><input id="num" inputmode="decimal" autocomplete="off" placeholder="Tu respuesta"></div><div class="hint">Usa punto o coma decimal.</div>`;
  }
  app.innerHTML = `
    <div class="top">
      <div><span class="tag">${tname(q.t)}</span>${lvlDots(q.lvl)}</div>
      <div class="prog">${i} de ${S.total}</div>
    </div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="card">
      ${body}
      <div id="fb"></div>
      <div class="actions">
        <button class="btn ghost" id="quit">Terminar</button>
        <button class="btn" id="go" disabled>Verificar</button>
      </div>
    </div>`;
  if(q.type==="mc"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(S.cur.done) return;
      app.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); S.cur.sel=+b.dataset.oi; $("#go").disabled=false;
    });
  } else {
    const inp=$("#num");
    inp.oninput=()=>{ $("#go").disabled = parseNum(inp.value)===null; };
    inp.onkeydown=e=>{ if(e.key==="Enter" && !$("#go").disabled) $("#go").click(); };
    setTimeout(()=>inp.focus(),50);
  }
  $("#go").onclick = ()=> S.cur.done ? nextQuestion() : check();
  $("#quit").onclick = showResults;
  typeset();
  window.scrollTo({top:0});
}

function parseNum(s){ s=(s||"").trim().replace(/\s/g,"").replace(",","."); if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return null; return parseFloat(s); }

function check(){
  const {q} = S.cur;
  let ok, given;
  if(q.type==="mc"){ ok = S.cur.sel===q.ans; given=q.opts[S.cur.sel]; }
  else { const v=parseNum($("#num").value); ok = Math.abs(v-q.ans) <= q.tol + 1e-9; given=String(v); $("#num").disabled=true; }
  // actualización de la habilidad
  const before = S.th[q.t];
  const p = prob(before, B[q.lvl]);
  S.th[q.t] = before + K*((ok?1:0)-p);
  S.n[q.t]++; if(ok) S.c[q.t]++;
  S.log.push({id:q.id,t:q.t,lvl:q.lvl,ok,given});
  S.cur.done = true;
  if(q.type==="mc"){
    app.querySelectorAll(".opt").forEach(b=>{
      b.disabled=true; const oi=+b.dataset.oi;
      if(oi===q.ans) b.classList.add("right");
      else if(oi===S.cur.sel) b.classList.add("wrong");
    });
  }
  const correctTxt = q.type==="num" ? `<br>Respuesta: <b>${fmt(q.ans)}</b>${q.unit?" "+q.unit:""}` : "";
  let adapt = "";
  if(S.log.length < S.total && (S.mode==="topic" || S.n[q.t] < MAX_PER_TOPIC)){
    const nl = targetLevel(S.th[q.t]);
    adapt = nl>q.lvl ? `La próxima pregunta de este tema será más difícil.` : nl<q.lvl ? `La próxima pregunta de este tema será más sencilla.` : `La próxima pregunta de este tema será de nivel similar.`;
  }
  $("#fb").innerHTML = `<div class="fb ${ok?'ok':'bad'}"><b class="v">${ok?'Correcto':'No es correcto'}</b>${q.exp}${ok?'':correctTxt}</div>${adapt?`<div class="adapt">${adapt}</div>`:""}`;
  const go=$("#go"); go.textContent = S.log.length>=S.total ? "Ver resultados" : "Siguiente"; go.disabled=false; go.focus({preventScroll:true});
  typeset();
}

function fmt(x){ return (Math.round(x*10000)/10000).toString(); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function status(t){
  if(!S.n[t]) return {cls:"b-na", txt:"Sin evaluar", col:"var(--line)"};
  const th=S.th[t];
  if(th>=0.7) return {cls:"b-ok", txt:"Sólido", col:"var(--ok)"};
  if(th>=-0.3) return {cls:"b-mid", txt:"En progreso", col:"#d4a017"};
  return {cls:"b-bad", txt:"Reforzar", col:"var(--bad)"};
}

function showResults(){
  const asked = S.log.length;
  if(!asked){ return renderHome(); }
  const right = S.log.filter(l=>l.ok).length;
  const topics = S.mode==="topic" ? TOPICS.filter(t=>t.id===S.topic) : TOPICS;
  const rows = topics.map(t=>{
    const st=status(t.id);
    const w = S.n[t.id] ? Math.round(100*prob(S.th[t.id],0)) : 0;
    return `<div class="trow">
      <div><span class="tname">${t.name}</span><span class="badge ${st.cls}">${st.txt}</span></div>
      <div class="tscore">${S.n[t.id]?`${S.c[t.id]}/${S.n[t.id]} correctas`:"—"}</div>
      <div class="meter"><div style="width:${w}%;background:${st.col}"></div></div>
    </div>`;}).join("");
  const weak = topics.filter(t=>S.n[t.id] && status(t.id).txt!=="Sólido").sort((a,b)=>S.th[a.id]-S.th[b.id]);
  const reco = weak.length
    ? `<div class="reco"><h3>Qué repasar</h3><ul>${weak.map(t=>`<li><b>${t.name}</b>: presentación «${t.deck}»${S.mode==="sim"?` · <a href="#" data-pr="${t.id}">practicar este tema</a>`:""}</li>`).join("")}</ul></div>`
    : `<div class="reco"><h3>Buen trabajo</h3><p class="muted">No hay temas débiles en lo que respondiste. Prueba de nuevo: las preguntas cambian.</p></div>`;
  const wrongs = S.log.filter(l=>!l.ok);
  const review = wrongs.length ? `<div class="card review" style="margin-top:18px"><h3 style="margin-bottom:6px">Preguntas a revisar</h3>${wrongs.map(l=>{
    const q=BANK.find(x=>x.id===l.id);
    const ans = q.type==="mc" ? q.opts[q.ans] : fmt(q.ans);
    return `<details><summary>${tname(q.t)} · ${LVLNAME[q.lvl]}</summary><p class="q">${q.q}</p>${q.code?`<pre><code>${esc(q.code)}</code></pre>`:""}<p><span class="muted">Tu respuesta:</span> ${l.given}<br><span class="muted">Correcta:</span> ${ans}</p><p class="muted">${q.exp}</p></details>`;}).join("")}</div>` : "";
  app.innerHTML = `
    <div class="eyebrow">Resultados</div>
    <div class="res-head">
      <div class="big">${right}<small> / ${asked} correctas</small></div>
      <div class="muted">${S.mode==="sim"?"Simulacro adaptativo":"Práctica: "+tname(S.topic)}</div>
    </div>
    <div class="card">${rows}</div>
    ${reco}
    ${review}
    <div class="actions" style="margin-top:24px">
      <button class="btn ghost" id="home">Inicio</button>
      <button class="btn acc" id="again">Intentar de nuevo</button>
    </div>
    <p class="hint" style="margin-top:16px">El nivel de cada tema se estima con tus respuestas: acertar una pregunta difícil sube más tu nivel que acertar una fácil, y fallar una fácil lo baja más. Con pocas preguntas por tema la estimación es aproximada.</p>`;
  $("#home").onclick = renderHome;
  const m=S.mode, tp=S.topic;
  $("#again").onclick = ()=>{ S=newState(m,tp); nextQuestion(); };
  app.querySelectorAll("[data-pr]").forEach(a=>a.onclick=e=>{e.preventDefault(); S=newState("topic",a.dataset.pr); nextQuestion();});
  typeset();
  window.scrollTo({top:0});
}

const ON_SITE = location.protocol==="file:" || /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
const BACK = ON_SITE ? `<a class="back" href="../index.html">← Sitio del curso</a>` : "";
function renderHome(){
  const nq = BANK.length;
  app.innerHTML = `${BACK}
    <div class="eyebrow">Econometría con Machine Learning · Maestría</div>
    <h1>Examen adaptativo</h1>
    <p class="lede">Prepárate para el examen con preguntas que se ajustan a tu nivel. Si aciertas, la siguiente pregunta del tema es más difícil; si fallas, ves la explicación y la siguiente es más sencilla.</p>
    <button class="card mode" id="sim">
      <h3>Simulacro completo</h3>
      <p>${TOPICS.length*P1_PER_TOPIC+P2_EXTRA} preguntas sobre los ${TOPICS.length} temas del curso. Al final, un diagnóstico por tema. Unos 30–40 minutos.</p>
    </button>
    <div class="card">
      <h3 style="font-size:1.15rem;margin-bottom:4px">Practicar un tema</h3>
      <p class="muted" style="margin:0;font-size:.95rem">Todas las preguntas del tema, adaptadas a tu nivel.</p>
      <div class="chips">${TOPICS.map(t=>`<button class="chip" data-t="${t.id}">${t.name}</button>`).join("")}</div>
    </div>
    <div class="how">
      <p><b>Tipos de pregunta:</b> conceptuales, interpretación de salidas de R de los notebooks del curso y ejercicios de cálculo con respuesta numérica.</p>
      <p><b>Niveles:</b> cada pregunta es básica, intermedia o avanzada. El banco tiene ${nq} preguntas y el orden cambia en cada intento.</p>
      <p>Es una herramienta de autoestudio: tus respuestas no se envían a nadie.</p>
    </div>`;
  $("#sim").onclick=()=>{ S=newState("sim"); nextQuestion(); };
  app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ S=newState("topic",c.dataset.t); nextQuestion(); });
  window.scrollTo({top:0});
}

renderHome();
</script>
</body>
